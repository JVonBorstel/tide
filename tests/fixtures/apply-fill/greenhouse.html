<!doctype html>
<html><head><meta charset="utf-8"><title>Job Application for AI Engineer at Acme</title></head>
<body>
<!-- Greenhouse-like (classic board, plain form post, a captcha box). Fixture only. -->
<div id="app_body"><h1>AI Engineer</h1><p>Acme, Remote</p>
<form id="application_form" action="/apply/greenhouse" method="post" enctype="multipart/form-data">
  <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label><input type="text" id="first_name" name="job_application[first_name]" aria-required="true"></div>
  <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label><input type="text" id="last_name" name="job_application[last_name]" aria-required="true"></div>
  <div class="field"><label for="email">Email <span class="asterisk">*</span></label><input type="text" id="email" name="job_application[email]" aria-required="true"></div>
  <div class="field"><label for="phone">Phone</label><input type="text" id="phone" name="job_application[phone]"></div>
  <div class="field"><label for="job_application_location">Location (City)</label><input type="text" id="job_application_location" name="job_application[location]"></div>
  <div class="field"><label for="resume">Resume/CV <span class="asterisk">*</span></label><input type="file" id="resume" name="job_application[resume]" style="display:none"><a href="#">Attach</a></div>
  <div class="field"><label for="cover_letter_text">Cover Letter</label><textarea id="cover_letter_text" name="job_application[cover_letter_text]"></textarea></div>
  <div class="field"><label for="q1">LinkedIn Profile</label><input type="text" id="q1" name="job_application[answers_attributes][0][text_value]"></div>
  <div class="field"><label for="q2">Website</label><input type="text" id="q2" name="job_application[answers_attributes][1][text_value]"></div>
  <div class="field"><label for="q3">Why do you want to work at Acme? <span class="asterisk">*</span></label><textarea id="q3" name="job_application[answers_attributes][2][text_value]" aria-required="true"></textarea></div>
  <div class="field"><label for="q4">What are your salary expectations?</label><input type="text" id="q4" name="job_application[answers_attributes][3][text_value]"></div>
  <div class="field"><label for="q5">Are you legally authorized to work in the United States? <span class="asterisk">*</span></label><select id="q5" name="job_application[answers_attributes][4][boolean_value]"><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="field"><label for="q6">Will you now or in the future require sponsorship for employment visa status?</label><select id="q6" name="job_application[answers_attributes][5][boolean_value]"><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="field"><label for="gender">Gender</label><select id="gender" name="job_application[gender]"><option value="">Please select</option><option value="1">Male</option><option value="2">Female</option><option value="3">Decline To Self Identify</option></select></div>
  <div class="field"><label for="q7">How did you hear about this job?</label><input type="text" id="q7" name="job_application[answers_attributes][6][text_value]"></div>
  <div class="g-recaptcha" data-sitekey="fixture-not-a-real-key"></div>
  <input type="submit" id="submit_app" value="Submit Application" onclick="fetch('/marker/greenhouse-press')">
</form></div>
<script>
let seq = 0; const f = document.getElementById('application_form');
const push = () => { const s = { seq: ++seq }; for (const el of f.querySelectorAll('input,textarea,select')) { const k = el.id || el.name;
  if (el.type === 'file') s[k] = [...el.files].map((x) => x.name + ':' + x.size); else if (el.type === 'radio' || el.type === 'checkbox') { if (el.checked) s[k + '=' + el.value] = true; } else if (el.type !== 'submit') s[k] = el.value; }
  fetch('/state/greenhouse', { method: 'POST', body: JSON.stringify(s) }); };
f.addEventListener('input', push); f.addEventListener('change', push);
</script>
</body></html>
