# Owns the Vale setup for Tide's prose (lane L4, WO-UPG-L4-6): the Tide vocabulary in styles/config/vocabularies/Tide.
# Called by the ci.yml "gates" job (vale-cli/vale-action, --config .vale/vale.ini, docs/ only, report only while GATE_VALE says report).
# Every rule here is a warning, so Vale exits 0 at its error level: the warnings are the report. Spelling is off (the code names would
# drown it). New names: docs/GLOSSARY.md first, then accept.txt. Old kitchen words in new prose: reject.txt (Vale.Avoid).
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Tide

[*.md]
BasedOnStyles = Vale
Vale.Spelling = NO
Vale.Terms = warning
Vale.Avoid = warning
Vale.Repetition = warning

# The glossary names the old words on purpose, and change notes are history (the glossary's history rule).
[{GLOSSARY.md,docs/GLOSSARY.md,docs/changes/*.md,changes/*.md}]
Vale.Avoid = NO