# The quick check machine, on every push to main and every pull request (ubuntu, a few minutes, billed 1x):
#   parse every PowerShell file, node --check, JSON validity, secret scan, Rust check (job "checks"), and the code-quality ratchet (job
#   "quality"). Both jobs run side by side and write their counts to the run's summary page.
# The full Windows suite is NOT here: it lives in windows-suite.yml (weekly, by hand, and on ci/** branches). The kitchen already runs
# the whole suite sandboxed on Jordan's PC before every PR (tests station) and again on main after the merge (verify), so a Windows
# run per PR and per merge was the 3rd and 4th copy, and at ~28 min x2 (Windows bills double) it spent the free 2000 minutes in about
# 15 merges. The cheap gate stays per change; the clean-box Windows run stays as a weekly drift check.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  # a run on main is never cancelled (release.yml tags what passed there); PR runs replaced by a newer push are
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
# Gate switches (lane L4, WO-UPG-L4-5): each gate reports on the summary page and never blocks while it says "report". Changing one line
# to "enforce" makes that gate block a PR; each change is a card for Jordan (build-way 4.3 cutover step 5).
env:
  GATE_WO_TITLE: report
  GATE_GENERATED: report
  GATE_DECISION: report
  GATE_NAMES: report
  GATE_VALE: report
jobs:
  # Code-quality ratchet (scripts/quality/metrics.ps1 over kitchen/quality-baseline.json): new long functions, deep nesting and duplicated
  # blocks fail, growth warns; PSScriptAnalyzer regressions on the PowerShell files this change touched (only when the runner image
  # already has the module; nothing is installed). fetch-depth 2 gives HEAD^1, the base the change is compared with: on a pull request
  # HEAD is GitHub's merge commit and HEAD^1 is the base branch; on main it is the commit before. Ubuntu, so billed 1x.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Quality ratchet (long functions, nesting, duplicates, analyzer on changed files)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/quality/metrics.ps1 -ChangedSince HEAD^1 -Summary $env:GITHUB_STEP_SUMMARY
      # Old names guard (Tide rename): lists kitchen words in the display text this change adds, against the same HEAD^1 base. Report
      # only while GATE_NAMES (top of this file) says report (exit 0); "enforce" adds -Enforce, which fails on new hits only (baseline).
      - name: Old names guard (scripts/check-names.ps1; GATE_NAMES)
        shell: pwsh
        run: |
          $enforce = @(); if ($env:GATE_NAMES -eq 'enforce') { $enforce = @('-Enforce') }
          pwsh -NoProfile -File scripts/check-names.ps1 -Base HEAD^1 -Summary $env:GITHUB_STEP_SUMMARY @enforce
      - name: Quality tests (tests/Test-Quality.ps1)
        shell: pwsh
        run: |
          $out = pwsh -NoProfile -File tests/Test-Quality.ps1 2>&1 | Out-String; $code = $LASTEXITCODE
          Write-Output $out
          $line = ($out -split "`n" | Where-Object { $_ -match '^Quality tests:' } | Select-Object -Last 1)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "`n## Tests`n`n- tests/Test-Quality.ps1: $line"
          exit $code
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PowerShell parse, node --check, JSON validity, secret scan
        shell: pwsh
        run: |
          $out = pwsh -NoProfile -File scripts/ci-quick-checks.ps1 2>&1 | Out-String; $code = $LASTEXITCODE
          Write-Output $out
          # The job summary page: the counts line and every FAIL line, so the result reads without opening the log.
          $keep = @($out -split "`n" | Where-Object { $_ -match '^(Quick checks:|FAIL:)' } | ForEach-Object { "- $($_.Trim())" })
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (@('## Quick checks', '') + $keep)
          exit $code
      # Shared contracts of the Tide upgrade (core/contracts, WO-UPG-L0-1): every fixture against its JSON Schema, then the contracts suite.
      # The runner's own node; no install, no network. Lane L4 owns this file from here on and keeps this step.
      - name: Contracts (core/contracts schemas, fixtures, validator)
        shell: pwsh
        run: |
          $fix = node core/contracts/validate.mjs 2>&1 | Out-String; $c1 = $LASTEXITCODE
          $out = pwsh -NoProfile -File tests/Test-Contracts.ps1 2>&1 | Out-String; $c2 = $LASTEXITCODE
          Write-Output $fix; Write-Output $out
          $keep = @(($fix + $out) -split "`n" | Where-Object { $_ -match '^(Contracts fixtures:|Contracts tests:|FAIL:)' } | ForEach-Object { "- $($_.Trim())" })
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (@('', '## Contracts', '') + $keep)
          if ($c1 -ne 0 -or $c2 -ne 0) { exit 1 }
      # The ship path (core/ship, scripts/check-*.mjs, flags.json; WO-UPG-L4): flags, gates, docs step, Resurvey, Handover queue. Throwaway
      # git repos in the temp folder only; no network.
      - name: Ship (core/ship flags, gates, docs step, Resurvey, Handover queue)
        shell: pwsh
        run: |
          $flags = node core/ship/flags.mjs check 2>&1 | Out-String; $c1 = $LASTEXITCODE
          $out = pwsh -NoProfile -File tests/Test-Ship.ps1 2>&1 | Out-String; $c2 = $LASTEXITCODE
          Write-Output $flags; Write-Output $out
          $keep = @(($flags + $out) -split "`n" | Where-Object { $_ -match '^(Flags:|Ship tests:|FAIL:)' } | ForEach-Object { "- $($_.Trim())" })
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (@('', '## Ship', '') + $keep)
          if ($c1 -ne 0 -or $c2 -ne 0) { exit 1 }
      - name: Rust check (kitchen-sandbox targets Windows; checked from Linux, no linking)
        working-directory: rust/kitchen-sandbox
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --offline --locked --target x86_64-pc-windows-gnu
      - name: Rust clippy (advisory, never fails the build)
        working-directory: rust/kitchen-sandbox
        continue-on-error: true
        run: cargo clippy --offline --locked --target x86_64-pc-windows-gnu
  # The ship gates (lane L4, WO-UPG-L4-5): each writes its verdict to the summary page and follows its switch at the top of this file
  # (report = never blocks). fetch-depth 2 gives HEAD^1, the base branch of GitHub's merge commit. On a push to main the PR gates say
  # SKIP. Vale (MIT, errata-ai/vale) lints the prose of docs/ with the Tide vocabulary in .vale/; only lines a PR adds are annotated.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Gate - WO id in the PR title (GATE_WO_TITLE)
        run: node scripts/check-wo-title.mjs --mode "$GATE_WO_TITLE"
      - name: Gate - no generated files in the PR (GATE_GENERATED)
        run: node scripts/check-generated.mjs --mode "$GATE_GENERATED" --base HEAD^1
      - name: Gate - decision before the Board's look changes (GATE_DECISION)
        run: node scripts/check-decision-gate.mjs --mode "$GATE_DECISION" --base HEAD^1
      - name: Gate - Vale vocabulary on docs/ (GATE_VALE)
        id: vale
        if: github.event_name == 'pull_request'
        continue-on-error: ${{ env.GATE_VALE != 'enforce' }}
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.24.0
          files: docs
          config: .vale/vale.ini
          filter_mode: added
          fail_level: ${{ env.GATE_VALE == 'enforce' && 'error' || 'none' }}
      - name: Gate - Vale summary
        if: always() && github.event_name == 'pull_request'
        run: |
          word="${{ steps.vale.outcome }}"
          vale=$(command -v vale || ls "$RUNNER_TOOL_CACHE"/vale/*/x64/vale 2>/dev/null | head -n 1 || true)
          if [ -n "$vale" ]; then
            w=$("$vale" --config .vale/vale.ini --output=line --minAlertLevel=warning docs 2>/dev/null | wc -l)
            e=$("$vale" --config .vale/vale.ini --output=line --minAlertLevel=error docs 2>/dev/null | wc -l)
            line="all of docs/: ${e} error(s), ${w} alert(s) at warning or above; the annotations show the ones on lines this PR adds"
          else
            line="the Vale binary was not found after the action, so no count (see the annotations)"
          fi
          printf '### Gate Vale vocabulary (docs/): %s (%s)\n\n- %s\n' "$word" "$GATE_VALE" "$line" >> "$GITHUB_STEP_SUMMARY"
          echo "Gate Vale vocabulary: ${word} (${GATE_VALE}); ${line}"